---
name: Release

on:
  release:
    types: [published]

jobs:
  upload-asset:
    name: Upload omni.zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Vale expects the zip to contain a top-level folder with the same name as the zip
      - name: Build package
        run: |
          mkdir -p build/omni
          cp -R styles build/omni/
          cp package.vale.ini build/omni/.vale.ini
          cd build && zip -r ../omni.zip omni

      - name: Upload asset to release
        run: gh release upload "${{ github.event.release.tag_name }}" omni.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
