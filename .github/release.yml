---
name: Release
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Create release
        run: |
          zip -r omni.zip .vale.ini styles/omni
          gh release create ${{ github.ref_name }} omni.zip \
            --title "Omni Vale Style Guide ${{ github.ref_name }}" \
            --notes "Release ${{ github.ref_name }} of Omni Vale Style Guide package."
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}