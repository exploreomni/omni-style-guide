# This is a template configuration file - you'll need to configure it
# to work with your specific project.

StylesPath = styles                 # https://docs.vale.sh/keys/stylespath
MinAlertLevel = suggestion          # https://docs.vale.sh/keys/minalertlevel
Packages = Microsoft                # https://docs.vale.sh/keys/packages

# Tells Vale to read one file type as another,
# which affects how the file is parsed
# https://docs.vale.sh/topics/.vale.ini#format-associations
[formats]
mdx = md

# Match all files to Vale styles
[*]
BasedOnStyles = Vale

# Match only MD and MDX files
[*.{md,mdx}]
BasedOnStyles = Vale