# This is a template configuration file - you'll need to configure it
# to work with your specific project.

# https://docs.vale.sh/keys/stylespath
StylesPath = styles                 

# https://docs.vale.sh/keys/minalertlevel
MinAlertLevel = suggestion

# https://docs.vale.sh/keys/packages
Packages = https://github.com/exploreomni/vale-style-guide/releases/latest/download/omni.zip                

# Tells Vale to read one file type as another,
# which affects how the file is parsed
# https://docs.vale.sh/topics/.vale.ini#format-associations
[formats]
mdx = md

# Match all files to Vale styles
[*]
BasedOnStyles = Vale

# Match only MD and MDX files
[*.{md,mdx}]
BasedOnStyles = Vale

StylesPath = styles

[*]
BasedOnStyles = Vale