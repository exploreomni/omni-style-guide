  - 'greatly'
  - 'highly'
  - 'literally'
  - 'just'
  - 'very'
  - 'remarkably'
  - 'notably'
  - 'significantly'
  - 'particularly'
  - 'especially'
  - 'exceptionally'
  - 'extraordinarily'
  - 'impressively'
  - 'strikingly'
